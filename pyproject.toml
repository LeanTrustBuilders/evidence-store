[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-store"
version = "0.6.0"
description = "An S3 evidence store in a GitHub repository: issue forms, intake, checks"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["evidence-core @ git+https://github.com/LeanTrustBuilders/evidence-core"]

[project.scripts]
evidence-store = "evidence_store.cli:main"

[tool.setuptools]
packages = ["evidence_store"]
